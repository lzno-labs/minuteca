# SPDX-License-Identifier: MPL-2.0
# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). Generate the project with:
#   brew install xcodegen && cd ios && xcodegen
# The .xcodeproj is generated, never committed.
name: Minuteca
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MinutecaKit:
    path: MinutecaKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Minuteca:
    type: application
    platform: iOS
    sources:
      - path: Minuteca
    dependencies:
      - package: MinutecaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MINUTECA_BUNDLE_ID)
        PRODUCT_NAME: minuteca
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: minuteca
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Minuteca/Info.plist
      properties:
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        # Keeps the microphone running with the screen locked or in another app.
        UIBackgroundModes: [audio]
        # minuteca://acceso?t=… from the sign-in page (docs/adr/0003-access.md).
        CFBundleURLTypes:
          - CFBundleURLName: minuteca-signin
            CFBundleURLSchemes: [minuteca]
        NSMicrophoneUsageDescription: $(MINUTECA_MIC_TEXT)
        NSFaceIDUsageDescription: $(MINUTECA_FACE_ID_TEXT)
        MinutecaServerURL: $(MINUTECA_SERVER_URL)
schemes:
  Minuteca:
    build:
      targets:
        Minuteca: all
    test:
      targets: []
