# iOS build on a macOS runner. While this repository is private, every macOS minute counts as
# ten, so this runs only by hand (Actions, ios, Run workflow). When the repository is public it
# becomes free: add `pull_request:` and `push: branches: [main]` to the triggers.
# Signing and TestFlight uploads never run here; they run from the deployment repository.
name: ios

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: MinutecaKit tests
        run: swift test --package-path ios/MinutecaKit
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build for the simulator (unsigned)
        run: |
          cd ios
          xcodebuild -project Minuteca.xcodeproj -scheme Minuteca \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
